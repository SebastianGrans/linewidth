<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>linewidth — saved pages</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>

<body>
  <h1>Saved pages</h1>
  <div id="sites"></div>

  <template id="site-card-template">
    <section class="site-card">
      <div class="site-header">
        <div class="site-name">
          <h2></h2>
          <p class="status"></p>
        </div>
        <button class="revoke" hidden>Revoke site access</button>
      </div>
      <ul></ul>
    </section>
  </template>

  <template id="page-row-template">
    <li>
      <span><a></a> — <span class="settings"></span></span>
      <div class="row-actions">
        <label class="switch" hidden>
          <input type="checkbox" class="toggle" />
          <span class="switch-slider"></span>
        </label>
        <button class="delete">Delete</button>
      </div>
    </li>
  </template>

  <script src="dashboard.js"></script>
</body>

</html>
